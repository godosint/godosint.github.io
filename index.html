<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/b756c00e57.js"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <meta property="og:title" content="@oans" />
    <meta property="og:description" content="Shiku's bio site" />
    <meta
      property="og:image"
      id="embed-icon"
      content="https://godosint.github.io/assets/img/pfp.png"
    />
    <meta name="theme-color" content="#8fbc8f" />

    <link rel="stylesheet" href="assets/css/style.css" />
    <link
      rel="shortcut icon"
      id="short-icon"
      href="assets/img/pfp.png"
      type="image/x-icon"
    />

    <script
      src="https://kit.fontawesome.com/b756c00e57.js"
      crossorigin="anonymous"
    ></script>

    <title>​</title>
  </head>
  <body>
    <div id="entry-overlay" class="entry-overlay">
      <div class="overlay-content">
        <p id="check-p">checking connection</p>
      </div>
    </div>

    <main>
      <div id="view-counter" class="view-counter">
        <span><i class="fa-regular fa-eye"></i> </span>
        <span id="page_views">0</span>
      </div>

      <img id="dc-pfp" src="assets/img/pfp.png" />
      <span id="who">shiku / salty</span>
      <span id="footer"></span>
      <!-- Music Player -->
      <div class="music-player">
        <input
          type="range"
          id="seek-bar"
          value="0"
          min="0"
          max="100"
          step="1"
        />
        <div class="controls">
          <div class="volume-control">
            <button id="volume-button">
              <i class="icon fa-solid fa-volume-up"></i>
            </button>
            <input
              type="range"
              id="volume-slider"
              min="0"
              max="1"
              step="0.01"
              style="display: none"
            />
          </div>
          <button id="prev"><i class="icon fa-solid fa-backward"></i></button>
          <button id="play-pause"><i class="icon fa-solid fa-play"></i></button>
          <button id="next"><i class="icon fa-solid fa-forward"></i></button>
          <button id="lyrics-button">
            <i class="icon fa-solid fa-music"></i>
          </button>
        </div>
      </div>
      <!-- Social Links -->
      <div class="flexbox">
        <a href="https://www.tiktok.com/@mdunculous" target="_blank"
          ><button><i class="icon fa-solid fa-gamepad"></i>@6mmortal</button></a
        >
        <a href="discord" target="_blank"
          ><button><i class="icon fa-brands fa-discord"></i>/ahh</button></a
        >
        <a href="https://www.tiktok.com/@shiku515" target="_blank"
          ><button><i class="icon fa-brands fa-tiktok"></i>@shiku515</button></a
        >
      </div>
    </main>

    <div id="overlay"></div>

    <div id="lyrics-popup">
      <h2>〤 lyrics 〤</h2>
      <div id="lyricsDisplay"><div class="loading"></div></div>
      <button id="lyrics-close">close</button>
    </div>

    <div id="popup">
      <h2>ʚ ♡ ɞ</h2>
      <ul>
        <li>
          <img src="" id="silent" alt="984960212718977054" /><span
            class="friend-name"
            >silent</span
          >
        </li>
        <li>
          <img src="" id="warn" alt="1158429903629336646" /><span
            class="friend-name"
            >warn</span
          >
        </li>
        <li>
          <img src="" id="solar" alt="1250233985133707267" /><span
            class="friend-name"
            >solar</span
          >
        </li>
        <li>
          <img src="" id="xeow" alt="1312494668541591653" /><span
            class="friend-name"
            >xeow</span
          >
        </li>
        <li>
          <img src="" id="heaven" alt="1064184917086449765" /><span
            class="friend-name"
            >heaven</span
          >
        </li>
        <li>
          <img src="" id="kuri" alt="1334886246987730997" /><span
            class="friend-name"
            >kuri</span
          >
        </li>
      </ul>
      <button onclick="closePopup()">close</button>
    </div>

    <audio id="audio" src=""></audio>

    <!-- <script src="assets/js/inspect.js"></script> -->
    <script src="assets/js/title.js"></script>
    <script src="assets/js/viewCount.js"></script>
    <script src="assets/js/popup.js"></script>
    <script src="assets/js/loadAssets.js"></script>
    <script src="assets/js/player.js"></script>
  </body>
</html>
